<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟测页面 · 半山烘焙（占位）</title>
<style>
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2937; }
  header { padding: 24px; background: #f3ede4; }
  header h1 { margin: 0 0 8px; font-size: 24px; }
  main { padding: 24px; max-width: 720px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0; font-size: 14px; }
  button { margin: 8px 0; padding: 8px 16px; border: 1px solid #1f2937; background: #fff; border-radius: 6px; cursor: pointer; }
  button:focus { outline: 2px solid #b45309; }
  footer { padding: 16px 24px; font-size: 12px; color: #6b7280; }
  .tall { height: 1600px; background: linear-gradient(#fff, #f3ede4); }
</style>
</head>
<body>
<header>
  <h1>半山烘焙 · 烟测占位页</h1>
  <p>本页为 scripts/shot.mjs 烟测专用，全部内容为占位。</p>
</header>
<main>
  <div class="card">
    <h2>云雾水洗 · 埃塞俄比亚 耶加雪菲（占位）</h2>
    <p>茉莉花香、柠檬酸质、红茶尾韵 · ¥68 / 200g</p>
  </div>
  <div class="card">
    <h2>火塘日晒 · 巴西 喜拉多（占位）</h2>
    <p>巧克力、烤坚果、低酸醇厚 · ¥58 / 200g</p>
  </div>
  <div class="card">
    <h2>山脊蜜处理 · 哥伦比亚 惠兰（占位）</h2>
    <p>红苹果、焦糖甜感、奶油口感 · ¥72 / 200g</p>
  </div>
  <button type="button">订阅占位按钮一</button>
  <button type="button">订阅占位按钮二</button>
  <div class="tall" aria-hidden="true"></div>
</main>
<footer>占位页脚 · 截图烟测 · 无外部资源</footer>
</body>
</html>
